<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AzaChain Test Page</title>
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #ddd; padding: 20px; }
    input, button, textarea { margin: 5px; padding: 6px; font-size: 1em; }
    button { cursor: pointer; }
    textarea { width: 100%; height: 100px; background: #222; color: #ddd; border: 1px solid #444; }
  </style>
</head>
<body>

<h2>🔐 Auth</h2>
<input id="username" placeholder="Username">
<input id="password" placeholder="Password" type="password">
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
<p><strong>Token:</strong> <span id="tokenDisplay"></span></p>

<h2>💸 Add Transaction</h2>
<input id="to" placeholder="To (Public Key)">
<input id="amount" placeholder="Amount" type="number">
<input id="signature" placeholder="Signature">
<button onclick="addTransaction()">Add Transaction</button>

<h2>⛏️ Mine Block</h2>
<button onclick="mineBlock()">Mine Block</button>

<h2>📄 Get Balance from PEM File</h2>
<input type="file" id="pubkeyFile" accept=".pem">
<button onclick="loadPemAndFetchBalance()">Load PEM & Get Balance</button>
<pre id="balance"></pre>

<h2>📦 All Blocks</h2>
<button onclick="getBlocks()">View All Blocks</button>
<textarea readonly id="blocks"></textarea>

<script>
const BASE_URL = "http://localhost:3000";
let token = "";

function stripPemHeaders(pem) {
  return pem
    .replace(/-----BEGIN PUBLIC KEY-----/, '')
    .replace(/-----END PUBLIC KEY-----/, '')
    .replace(/\r?\n|\r/g, '')
    .trim();
}

function setToken(t) {
  token = t;
  document.getElementById("tokenDisplay").textContent = t;
  localStorage.setItem("token", t);
}

function getAuthHeaders() {
  return {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${token}`
  };
}

async function register() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const res = await fetch(`${BASE_URL}/user/register`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();
  alert(JSON.stringify(data, null, 2));
}

async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const res = await fetch(`${BASE_URL}/user/login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();
  if (data.token) {
    setToken(data.token);
    alert("Login successful");
  } else {
    alert("Login failed: " + JSON.stringify(data));
  }
}

async function addTransaction() {
  const to = document.getElementById("to").value;
  const amount = parseFloat(document.getElementById("amount").value);
  const signature = document.getElementById("signature").value;
  const res = await fetch(`${BASE_URL}/chain/transaction`, {
    method: "POST",
    headers: getAuthHeaders(),
    body: JSON.stringify({ to, amount, signature })
  });
  const data = await res.json();
  alert(JSON.stringify(data, null, 2));
}

async function mineBlock() {
  const res = await fetch(`${BASE_URL}/chain/mine`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
  });
  const data = await res.json();
  alert(JSON.stringify(data, null, 2));
}

function loadPemAndFetchBalance() {
  const fileInput = document.getElementById("pubkeyFile");
  if (!fileInput.files[0]) {
    alert("Please select a PEM file.");
    return;
  }

  const reader = new FileReader();
  reader.onload = async function (e) {
    const rawPem = e.target.result;
    const pubKey = stripPemHeaders(rawPem);

    try {
      const res = await fetch(`${BASE_URL}/chain/balance/${encodeURIComponent(pubKey)}`, {
        method: "GET",
        headers: getAuthHeaders(),
      });
      const data = await res.json();
      document.getElementById("balance").textContent = JSON.stringify(data, null, 2);
    } catch (err) {
      alert("Failed to fetch balance: " + err.message);
    }
  };
  reader.readAsText(fileInput.files[0]);
}

async function getBlocks() {
  const res = await fetch(`${BASE_URL}/chain/blocks`);
  const data = await res.json();
  document.getElementById("blocks").value = JSON.stringify(data, null, 2);
}

// Load token from localStorage
window.onload = () => {
  const stored = localStorage.getItem("token");
  if (stored) setToken(stored);
};
</script>

</body>
</html>
